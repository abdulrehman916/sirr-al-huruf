name: Premium website checks

on:
  push:
    branches: [premium-website]
  pull_request:
    branches: [premium-website]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify locked calculation core
        run: npm run verify:calculations
      - name: Build production bundle
        run: npm run build
